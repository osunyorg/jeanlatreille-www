[[cors]]
allowed_origins = "*"
allowed_methods = ["GET", "POST"]
allowed_headers = "*"

[[headers]]
for = ["**/*.woff2", "**/*.woff", "**/*.svg", "**/*.ttf", "**/*.otf", "**/*.eot", "**/*.js", "**/*.css"]
compress = "gzip"
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
for = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.webp"]
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[redirects]]
from = "/articles/equipe-editoriale/index.html"
to = "/personnes/equipe-editoriale/"

[[redirects]]
from = "/actualites/index.html"
to = "/publications/"

[[redirects]]
from = "/personnes/jean-latreille/actualites/index.html"
to = "/personnes/jean-latreille/publications/"

[[redirects]]
from = "/publications/2026-08-14-merci-les-pauvres-1/index.html"
to = "/publications/2024-08-14-merci-les-pauvres-1/"

